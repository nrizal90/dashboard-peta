<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="assets/js/sb-admin-2.min.js"></script>
<script src="assets/js/vokasi-api.js"></script>
<script>
	function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

	VokasiApi.init().then(function () {
		var gap = (VokasiApi.gap() || []).slice();
		var sektor = (VokasiApi.refs().sektor) || [];
		var s = VokasiApi.summary() || {};
		var gs = s.gap_sektor || {};
		var totalSel = gs.total_sel || 0;
		var totalKosong = gs.sel_kosong || 0;

		// Urutkan provinsi: paling lengkap dulu.
		gap.sort(function (a, b) { return b.sektor_tersedia - a.sektor_tersedia; });

		document.getElementById('gapAlert').innerHTML =
			'Dari <strong>' + totalSel + '</strong> kombinasi (' + gap.length + ' provinsi × ' + sektor.length + ' sektor), ' +
			'<strong>' + (totalSel - totalKosong) + '</strong> terisi dan ' +
			'<strong class="text-danger">' + totalKosong + ' kosong</strong>. ' +
			'Sel merah = sektor tidak tersedia di provinsi itu — insight kebijakan paling bernilai.';

		// Header
		var head = '<th class="prov">Provinsi</th>';
		sektor.forEach(function (sk) {
			head += '<th title="' + esc(sk.nama) + '">' + esc(sk.nama.substr(0, 10)) + '</th>';
		});
		head += '<th>Terisi</th>';
		document.getElementById('gapHead').innerHTML = head;

		// Body
		var body = '';
		gap.forEach(function (row) {
			body += '<tr><th class="prov">' + esc(row.provinsi) + '</th>';
			sektor.forEach(function (sk) {
				var v = (row.sektor && row.sektor[sk.slug]) ? parseInt(row.sektor[sk.slug], 10) : 0;
				var cls = v > 0 ? 'gap-cell-fill' : 'gap-cell-empty';
				body += '<td class="' + cls + '" title="' + esc(sk.nama) + ': ' + v + '">' + (v > 0 ? v : '·') + '</td>';
			});
			body += '<td class="font-weight-bold">' + (row.sektor_tersedia | 0) + '/' + sektor.length + '</td></tr>';
		});
		document.getElementById('gapBody').innerHTML = body;
	});
</script>
